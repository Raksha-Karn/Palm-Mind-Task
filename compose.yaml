services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: raksha
      POSTGRES_USER: raksha
      POSTGRES_PASSWORD: raksha
    ports: ["127.0.0.1:58482:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksha -d raksha"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:48539:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    ports: ["127.0.0.1:43360:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
